[package]
name = "backbone-announcements"
version = "0.1.5"
edition = "2021"
description = "HR broadcast announcements with audience targeting, publish window and read tracking"

[lib]
path = "src/lib.rs"

[dependencies]
backbone-outbox = { git = "https://github.com/faridlab/backbone-framework", tag = "v2.7.34", features = ["multi_tenant"] }
# Backbone Framework CORE dependencies
backbone-core = { git = "https://github.com/faridlab/backbone-framework", tag = "v2.7.34", features = ["postgres"] }
backbone-orm = { git = "https://github.com/faridlab/backbone-framework", tag = "v2.7.34" }
backbone-auth = { git = "https://github.com/faridlab/backbone-framework", tag = "v2.7.34", features = ["axum"] }
backbone-messaging = { git = "https://github.com/faridlab/backbone-framework", tag = "v2.7.34" }


# OpenAPI schema derives. Unconditional: the generator emits an ungated
# `use utoipa::ToSchema;` in every entity and DTO file, so the crate must
# always provide it regardless of the `openapi` feature.
utoipa = { version = "5", features = ["chrono", "uuid"] }

# Core dependencies
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.36", features = ["serde"] }

# Database (PostgreSQL Primary)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "rust_decimal"] }

# Protocol Buffers (Generated from Schema-First YAML)
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
pbjson = "0.7"

# Validation
validator = { version = "0.16", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Validation helpers
regex = "1.0"

# HTTP Framework (Axum)
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Configuration
config = "0.14"
serde_yaml = "0.9"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[features]
default = []
events = []
auth = []
grpc = []
openapi = []
validation = []
# Transport adapter under src/infrastructure/gateway/ (ADR-0024 seam). Off by
# default — the composing service opts in; the module core stays transport-free.

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3.0"
tokio-test = "0.4"
mockall = "0.12"
pretty_assertions = "1.0"

# Integration testing framework
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
jsonwebtoken = "9.3"
rand = "0.8"

# TEST-ONLY edge: the dispatch seam proves a notification lands a REAL outbound message in backbone-
# communication (the channel gateway) via an in-test CommunicationPort. Dev-dependency ONLY — the shipped
# library reaches communication through the port, never a Cargo edge.
backbone-communication = { path = "../backbone-communication" }
